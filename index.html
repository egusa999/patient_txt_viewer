<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>病棟テキストビューア</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E4A6B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="病棟ビューア">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F3EE;
    --paper:#FFFFFF;
    --ink:#20262B;
    --ink-soft:#5B6570;
    --line:#E4E0D6;
    --ward:#2E4A6B;
    --ward-soft:#EAF0F6;
    --room:#4F8A7B;
    --room-soft:#EAF4F1;
    --ring:#C9C3B4;
    --shadow: 0 18px 40px -20px rgba(32,38,43,0.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{
    overscroll-behavior-x:none; /* 横スワイプでのブラウザ「戻る」誤操作を防止 */
  }
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, #FBFAF6 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', sans-serif;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    overscroll-behavior-x:none;
    padding:
      max(12px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(12px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
  }
  .app{
    width:100%;
    max-width:720px;
    display:flex;
    flex-direction:column;
    min-height:100%;
  }
  @media (min-width:641px){
    body{ padding:28px 16px 60px; }
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin:2px 4px 18px;
  }
  .brand .ring-dots{
    display:flex;
    gap:5px;
  }
  .brand .ring-dots span{
    width:7px;height:7px;border-radius:50%;
    background:var(--ring);
    display:inline-block;
  }
  .brand h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:.04em;
    margin:0;
    color:var(--ink);
  }
  .brand .sub{
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.06em;
  }

  /* ---- Flip scene ---- */
  .scene{
    perspective:2200px;
    position:relative;
    flex:1;
    min-height:0;
  }
  .flip-card{
    position:relative;
    width:100%;
    height:100%;
    min-height:60vh;
    transform-style:preserve-3d;
    transition:transform .68s cubic-bezier(.62,.08,.24,1);
  }
  .flip-card.flipped{ transform:rotateY(180deg); }

  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    background:var(--paper);
    border-radius:18px;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .face-back{ transform:rotateY(180deg); }

  /* binder ring holes along the left spine, purely decorative */
  .face::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0; width:26px;
    background:
      repeating-linear-gradient(
        180deg,
        transparent 0px, transparent 22px,
        var(--ring) 22px, var(--ring) 23px,
        transparent 23px, transparent 45px
      );
    background-position:center 30px;
    background-repeat:repeat-y;
    opacity:.55;
    pointer-events:none;
  }
  .face-inner{
    position:relative;
    padding:22px 22px 22px 40px;
    display:flex;
    flex-direction:column;
    height:100%;
    min-height:0;
  }

  /* ---- top bar (front) ---- */
  .toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:10px;
    font-weight:700;
    letter-spacing:.02em;
  }
  .btn-primary{
    background:var(--ward);
    color:#fff;
    padding:11px 16px;
    font-size:14px;
    box-shadow:0 8px 18px -8px rgba(46,74,107,.6);
  }
  .btn-primary:active{ transform:translateY(1px); }
  .btn-ghost{
    background:var(--ward-soft);
    color:var(--ward);
    padding:10px 14px;
    font-size:13px;
  }
  .btn-icon{
    background:var(--ward-soft);
    color:var(--ward);
    width:38px;height:38px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    flex:0 0 auto;
  }
  .folder-field{
    flex:1 1 220px;
    min-width:0;
    background:#FAF9F5;
    border:1px dashed var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-size:12.5px;
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .status-line{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 14px 2px;
    min-height:16px;
  }

  /* ---- ward list ---- */
  .list-scroll{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding-right:4px;
    margin-right:-4px;
  }
  .ward-group{
    margin-bottom:16px;
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .ward-head{
    background:var(--ward-soft);
    color:var(--ward);
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:13.5px;
    letter-spacing:.03em;
  }
  .ward-head.has-map{
    cursor:pointer;
  }
  .ward-head.has-map:active{
    background:var(--room-soft);
  }
  .ward-head .map-icon{
    font-size:12px;
    opacity:.8;
  }
  .ward-head .count{
    margin-left:auto;
    font-size:11px;
    font-weight:500;
    color:var(--ward);
    opacity:.75;
    font-family:'SFMono-Regular', Consolas, monospace;
  }
  .room-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 14px;
    border-top:1px solid var(--line);
    background:var(--paper);
    text-align:left;
    width:100%;
  }
  .room-row:active{ background:var(--room-soft); }
  .room-badge{
    flex:0 0 auto;
    background:var(--room-soft);
    color:var(--room);
    font-weight:700;
    font-size:12.5px;
    padding:6px 9px;
    border-radius:8px;
    font-family:'SFMono-Regular', Consolas, monospace;
    min-width:64px;
    text-align:center;
  }
  .room-meta{
    flex:1;
    min-width:0;
    display:flex;
    align-items:baseline;
    gap:8px;
    overflow-x:auto;
    white-space:nowrap;
    scrollbar-width:thin;
    -webkit-overflow-scrolling:touch;
  }
  .room-meta::-webkit-scrollbar{ height:4px; }
  .room-meta .demo{
    font-size:13px;
    color:var(--ink);
    font-weight:600;
    flex:0 0 auto;
  }
  .room-meta .diag{
    font-size:12px;
    color:var(--ink-soft);
    flex:0 0 auto;
  }
  .chev{
    color:var(--ink-soft);
    font-size:16px;
    flex:0 0 auto;
  }

  .empty-state{
    margin-top:20px;
    padding:26px 16px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    border:1px dashed var(--line);
    border-radius:14px;
  }

  /* ---- detail (back) ---- */
  .detail-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .chip-row{
    display:flex;
    gap:8px;
    margin-left:2px;
    flex-wrap:wrap;
  }
  .chip{
    font-size:12px;
    font-weight:700;
    padding:6px 11px;
    border-radius:999px;
  }
  .chip-ward{ background:var(--ward-soft); color:var(--ward); }
  .chip-room{ background:var(--room-soft); color:var(--room); }
  .detail-pid{
    font-size:11.5px;
    color:var(--ink-soft);
    margin:2px 2px 12px;
    font-family:'SFMono-Regular', Consolas, monospace;
  }
  .detail-body{
    flex:1;
    min-height:0;
    overflow-y:auto;
    white-space:pre-wrap;
    word-break:break-word;
    font-size:13.5px;
    line-height:1.85;
    padding:16px 16px 24px;
    background:#FCFBF8;
    border:1px solid var(--line);
    border-radius:12px;
  }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }

  /* ---- ward map modal ---- */
  .map-overlay{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .map-overlay[hidden]{ display:none; }
  .map-backdrop{
    position:absolute;
    inset:0;
    background:rgba(24,28,32,0.72);
  }
  .map-panel{
    position:relative;
    background:var(--paper);
    border-radius:16px;
    width:min(92vw, 720px);
    max-width:min(92vw, 720px);
    height:min(80vh, 640px);
    max-height:92vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.5);
  }
  .map-panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    font-weight:700;
    font-size:13px;
    color:var(--ward);
  }
  .map-img-wrap{
    flex:1;
    min-height:0;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#F2F1EC;
    touch-action:none;
    cursor:grab;
  }
  .map-img-wrap.grabbing{ cursor:grabbing; }
  .map-img-wrap img{
    max-width:100%;
    max-height:80vh;
    display:block;
    transform-origin:center center;
    will-change:transform;
    user-select:none;
    -webkit-user-drag:none;
    touch-action:none;
  }
  .map-img-wrap img[hidden]{ display:none; }
  .map-error{
    color:var(--ink-soft);
    font-size:13px;
    text-align:center;
    padding:20px;
  }

  /* ---- mobile: maximize usable area, shrink type ---- */
  @media (max-width:640px){
    .brand{ margin:0 2px 8px; gap:7px; }
    .brand .ring-dots span{ width:5px; height:5px; }
    .brand h1{ font-size:16px; }
    .brand .sub{ font-size:9px; letter-spacing:.04em; }

    .face-inner{ padding:12px 12px 12px 26px; }
    .face::before{ width:16px; }
    .face::before{
      background-position:center 18px;
    }

    .toolbar{ gap:6px; margin-bottom:8px; }
    .btn-primary{ padding:8px 11px; font-size:12px; }
    .btn-ghost{ padding:7px 10px; font-size:11px; }
    .btn-icon{ width:30px; height:30px; font-size:13px; }
    .folder-field{ padding:7px 9px; font-size:10.5px; flex-basis:140px; }
    .status-line{ font-size:10px; margin-bottom:8px; min-height:13px; }

    .ward-group{ margin-bottom:10px; border-radius:10px; }
    .ward-head{ padding:7px 10px; font-size:11.5px; }
    .ward-head .count{ font-size:9.5px; }
    .room-row{ padding:8px 10px; gap:8px; }
    .room-badge{ font-size:11px; padding:4px 6px; min-width:50px; }
    .room-meta .demo{ font-size:11.5px; }
    .room-meta .diag{ font-size:10.5px; }
    .chev{ font-size:14px; }
    .empty-state{ padding:16px 10px; font-size:11.5px; margin-top:10px; }

    .detail-head{ margin-bottom:8px; gap:6px; }
    .chip{ font-size:10px; padding:4px 8px; }
    .detail-pid{ font-size:10px; margin:0 2px 8px; }
    .detail-body{ font-size:12px; line-height:1.7; padding:10px 10px 16px; border-radius:9px; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="brand">
    <span class="ring-dots"><span></span><span></span><span></span></span>
    <div>
      <h1>病棟テキストビューア</h1>
      <div class="sub">WARD &nbsp;/&nbsp; ROOM &nbsp;TEXT&nbsp; VIEWER</div>
    </div>
  </div>

  <div class="scene">
    <div class="flip-card" id="flipCard">

      <!-- FRONT: folder select + ward/room list -->
      <div class="face face-front">
        <div class="face-inner">
          <div class="toolbar">
            <button class="btn-primary" id="pickBtn">📁 フォルダを選択</button>
            <div class="folder-field" id="folderField">未選択</div>
            <button class="btn-icon" id="refreshBtn" title="再読み込み">⟳</button>
            <button class="btn-ghost" id="installBtn" hidden>📲 インストール</button>
          </div>
          <input type="file" id="folderInput" webkitdirectory multiple accept=".txt" hidden>
          <div class="status-line" id="statusLine"></div>

          <div class="list-scroll" id="listScroll">
            <div class="empty-state" id="emptyState">
              左上の「フォルダを選択」から、テキストファイルの入ったフォルダを選んでください。<br>
              各ファイル冒頭の「病棟:」「病室:」を読み取り、病棟・病室ごとに一覧表示します。
            </div>
          </div>
        </div>
      </div>

      <!-- BACK: detail viewer -->
      <div class="face face-back">
        <div class="face-inner">
          <div class="detail-head">
            <button class="btn-ghost" id="backBtn">← 戻る</button>
            <div class="chip-row" id="chipRow"></div>
          </div>
          <div class="detail-pid" id="detailPid"></div>
          <div class="detail-body" id="detailBody"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- 病棟マップ モーダル -->
<div class="map-overlay" id="mapOverlay" hidden>
  <div class="map-backdrop" id="mapBackdrop"></div>
  <div class="map-panel">
    <div class="map-panel-head">
      <span id="mapTitle"></span>
      <button class="btn-icon" id="mapResetBtn" title="拡大をリセット">⟲</button>
      <button class="btn-icon" id="mapCloseBtn" title="閉じる">✕</button>
    </div>
    <div class="map-img-wrap">
      <img id="mapImage" alt="病棟マップ">
      <div class="map-error" id="mapError" hidden>画像を読み込めませんでした。</div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- history trap ----------
  // Android等のシステム「戻る」ジェスチャーや横フリックで、
  // このアプリより前のページ（index.htmlより前）まで戻ってしまわないようにする。
  // 戻る操作を検知したら、詳細表示中なら一覧に戻し、一覧なら何もしない。
  history.pushState({ wardviewer: true }, '', location.href);
  window.addEventListener('popstate', () => {
    const overlay = document.getElementById('mapOverlay');
    if (overlay && !overlay.hidden){
      closeWardMap();
    } else if (flipCardEl().classList.contains('flipped')){
      flipCardEl().classList.remove('flipped');
    }
    history.pushState({ wardviewer: true }, '', location.href);
  });
  function flipCardEl(){ return document.getElementById('flipCard'); }

  const pickBtn = document.getElementById('pickBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const folderInput = document.getElementById('folderInput');
  const backBtn = document.getElementById('backBtn');
  const folderField = document.getElementById('folderField');
  const statusLine = document.getElementById('statusLine');
  const listScroll = document.getElementById('listScroll');
  const emptyState = document.getElementById('emptyState');
  const flipCard = document.getElementById('flipCard');
  const chipRow = document.getElementById('chipRow');
  const detailPid = document.getElementById('detailPid');
  const detailBody = document.getElementById('detailBody');

  const DB_NAME = 'wardTextViewerDB';
  const STORE = 'handles';
  const KEY = 'lastFolder';

  let currentHandle = null;

  // ---------- ward map images ----------
  // ファイル名パターン: 病棟名_YYYYMMDD_HHMMSS.png
  const WARD_MAP_RE = /^(.+)_(\d{8})_(\d{6})\.png$/i;
  let wardImages = new Map(); // wardName -> File (最新のもの)
  let currentMapUrl = null;

  function considerWardMapFile(name, file){
    const m = name.match(WARD_MAP_RE);
    if (!m) return;
    const ward = m[1];
    const stamp = m[2] + m[3];
    const existing = wardImages.get(ward);
    if (!existing || stamp > existing.stamp){
      wardImages.set(ward, { file, stamp });
    }
  }

  function openWardMap(wardName){
    const entry = wardImages.get(wardName);
    if (!entry) return;
    if (currentMapUrl) URL.revokeObjectURL(currentMapUrl);
    // Android(SAF/クラウド経由)ではFile.typeが空や不正になることがあり、
    // そのままだとブラウザが画像として認識せず壊れたアイコンになるため、
    // 拡張子から正しいMIMEタイプを付け直したBlobを作る。
    const file = entry.file;
    const mime = file.type && file.type.startsWith('image/') ? file.type : 'image/png';
    const blob = (file.type === mime) ? file : new Blob([file], { type: mime });
    currentMapUrl = URL.createObjectURL(blob);
    mapError.hidden = true;
    mapImage.hidden = false;
    mapImage.src = currentMapUrl;
    mapTitle.textContent = wardName;
    mapOverlay.hidden = false;
    resetMapZoom();
  }

  function closeWardMap(){
    mapOverlay.hidden = true;
    if (currentMapUrl){
      URL.revokeObjectURL(currentMapUrl);
      currentMapUrl = null;
    }
  }

  const mapOverlay = document.getElementById('mapOverlay');
  const mapBackdrop = document.getElementById('mapBackdrop');
  const mapImgWrap = document.querySelector('.map-img-wrap');
  const mapImage = document.getElementById('mapImage');
  const mapError = document.getElementById('mapError');
  const mapTitle = document.getElementById('mapTitle');
  const mapCloseBtn = document.getElementById('mapCloseBtn');
  const mapResetBtn = document.getElementById('mapResetBtn');
  mapCloseBtn.addEventListener('click', closeWardMap);
  mapResetBtn.addEventListener('click', resetMapZoom);
  mapBackdrop.addEventListener('click', closeWardMap);
  mapImage.addEventListener('error', () => {
    mapImage.hidden = true;
    mapError.hidden = false;
  });

  // ---------- ward map: pinch-zoom / pan ----------
  (function enableMapZoomPan(){
    const MIN_SCALE = 1, MAX_SCALE = 6;
    let scale = 1, tx = 0, ty = 0;
    let pointers = new Map();
    let lastDist = null;
    let lastMid = null;
    let lastPan = null;
    let lastTapTime = 0;

    window.resetMapZoomImpl = () => {
      scale = 1; tx = 0; ty = 0;
      applyTransform();
    };

    function applyTransform(){
      mapImage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    }

    function clampScale(s){
      return Math.min(MAX_SCALE, Math.max(MIN_SCALE, s));
    }

    mapImgWrap.addEventListener('pointerdown', (e) => {
      mapImgWrap.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      mapImgWrap.classList.add('grabbing');
      if (pointers.size === 1){
        lastPan = { x: e.clientX, y: e.clientY };
      } else if (pointers.size === 2){
        const pts = Array.from(pointers.values());
        lastDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        lastMid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
      }
    });

    mapImgWrap.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1){
        const p = pointers.get(e.pointerId);
        tx += p.x - lastPan.x;
        ty += p.y - lastPan.y;
        lastPan = { x: p.x, y: p.y };
        applyTransform();
      } else if (pointers.size === 2){
        const pts = Array.from(pointers.values());
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
        if (lastDist){
          scale = clampScale(scale * (dist / lastDist));
        }
        if (lastMid){
          tx += mid.x - lastMid.x;
          ty += mid.y - lastMid.y;
        }
        lastDist = dist;
        lastMid = mid;
        applyTransform();
      }
    });

    function endPointer(e){
      pointers.delete(e.pointerId);
      mapImgWrap.classList.remove('grabbing');
      lastDist = null;
      lastMid = null;
      if (pointers.size === 1){
        const [p] = pointers.values();
        lastPan = { x: p.x, y: p.y };
      }
    }
    mapImgWrap.addEventListener('pointerup', (e) => {
      if (pointers.size === 1){
        const now = Date.now();
        if (now - lastTapTime < 300){
          if (scale > 1) window.resetMapZoomImpl();
          else { scale = 2.2; applyTransform(); }
        }
        lastTapTime = now;
      }
      endPointer(e);
    });
    mapImgWrap.addEventListener('pointercancel', endPointer);

    // デスクトップのマウスホイール/トラックパッドでの拡縮
    mapImgWrap.addEventListener('wheel', (e) => {
      e.preventDefault();
      scale = clampScale(scale * (e.deltaY < 0 ? 1.12 : 0.89));
      applyTransform();
    }, { passive: false });
  })();

  function resetMapZoom(){
    if (window.resetMapZoomImpl) window.resetMapZoomImpl();
  }


  // ---------- IndexedDB: remember last selected folder handle ----------
  function openDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function saveHandle(handle){
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(handle, KEY);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function loadHandle(){
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  // ---------- parsing ----------
  function parseRecord(fileName, text){
    const lines = text.split(/\r?\n/);
    let ward = null, room = null;
    for (const line of lines){
      if (!ward){
        const m = line.match(/^\s*病棟[:：]\s*(.+?)\s*$/);
        if (m) { ward = m[1]; continue; }
      }
      if (!room){
        const m = line.match(/^\s*病室[:：]\s*(.+?)\s*$/);
        if (m) { room = m[1]; continue; }
      }
      if (ward && room) break;
    }
    // PID/患者ID: 「PID:」「患者ID:」「PID」(コロンなし)「患者ID 123456」(文中埋め込み) 等の表記ゆれに対応
    const pidMatch = text.match(/(?:患者ID|PID)[:：]?\s*(\d{4,})/);
    let pid = pidMatch ? pidMatch[1] : null;
    // 本文にPID記載が無い場合はファイル名 (dwh_ubie_result_XXXXXXXXXX_...) から補完
    if (!pid){
      const fnMatch = fileName.match(/dwh_ubie_result_(\d+)_/);
      if (fnMatch) pid = fnMatch[1];
    }

    // 年齢・性別: 「78歳2ヶ月 男性」のように同一行の場合と、
    // 「年齢: 78歳2ヶ月」「性別: 女性」のように別行の場合の両方に対応
    let demo = null;
    const comboMatch = text.match(/(\d+)\s*歳[^\n]*?(男性|女性)/);
    if (comboMatch){
      demo = `${comboMatch[1]}歳 ${comboMatch[2]}`;
    } else {
      const ageMatch = text.match(/年齢[:：]?\s*(\d+)\s*歳/);
      const sexMatch = text.match(/性別[:：]?\s*(男性|女性)/);
      if (ageMatch && sexMatch) demo = `${ageMatch[1]}歳 ${sexMatch[1]}`;
      else if (ageMatch) demo = `${ageMatch[1]}歳`;
      else if (sexMatch) demo = sexMatch[1];
    }

    // 病名(主病名): 「主病名: ○○」の直接記載と、
    // プロブレムリストの「#1 ○○（主病名）」「1. ○○ (主病名)」形式の両方に対応
    let diagnosis = null;
    const diagLabelMatch = text.match(/主病名[:：]\s*(.+)/);
    if (diagLabelMatch){
      diagnosis = diagLabelMatch[1];
    } else {
      const diagParenMatch = text.match(/^[ \t]*(?:#\d+\.?|\d+\.)?[ \t]*(.+?)[ \t]*[（(]主病名[）)]/m);
      if (diagParenMatch) diagnosis = diagParenMatch[1];
    }
    if (diagnosis) diagnosis = diagnosis.replace(/\s+/g, ' ').trim();

    // 手術日から術後日数を算出（当日基準）。「YYYY/MM/DD」「YYYY年M月D日」双方に対応
    let postOpDays = null;
    const surgMatch = text.match(/手術日[:：]\s*(\d{4})[\/年](\d{1,2})[\/月](\d{1,2})/);
    if (surgMatch){
      const surgDate = new Date(parseInt(surgMatch[1], 10), parseInt(surgMatch[2], 10) - 1, parseInt(surgMatch[3], 10));
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      postOpDays = Math.round((today - surgDate) / 86400000);
    }

    if (!ward || !room) return null;

    const roomNumMatch = room.match(/(\d+)/);
    const roomNum = roomNumMatch ? parseInt(roomNumMatch[1], 10) : 999999;

    return { fileName, ward, room, roomNum, pid, demo, diagnosis, postOpDays, text };
  }

  function statusText(rec){
    const parts = [];
    if (rec.diagnosis) parts.push(rec.diagnosis);
    if (rec.postOpDays !== null){
      parts.push(rec.postOpDays >= 0 ? `術後${rec.postOpDays}日` : '術前');
    }
    return parts.length ? parts.join(' ・ ') : null;
  }

  function maskPid(pid){
    if (!pid) return 'PID 不明';
    if (pid.length <= 4) return 'PID ' + pid;
    return 'PID ••••' + pid.slice(-4);
  }

  // ---------- folder loading ----------
  async function loadFolder(handle){
    statusLine.textContent = '読み込み中…';
    listScroll.innerHTML = '';
    currentHandle = handle;
    folderField.textContent = handle.name;
    wardImages = new Map();

    const records = [];
    let skipped = 0;

    try {
      for await (const entry of handle.values()){
        if (entry.kind !== 'file') continue;
        if (/\.png$/i.test(entry.name)){
          try {
            const file = await entry.getFile();
            considerWardMapFile(entry.name, file);
          } catch (e){ /* ignore */ }
          continue;
        }
        if (!/\.txt$/i.test(entry.name)) continue;
        try {
          const file = await entry.getFile();
          const text = await file.text();
          const rec = parseRecord(entry.name, text);
          if (rec) records.push(rec);
          else skipped++;
        } catch (e){
          skipped++;
        }
      }
    } catch (e){
      statusLine.textContent = 'フォルダの読み込みに失敗しました: ' + e.message;
      return;
    }

    renderList(records, skipped);
  }

  function renderList(records, skipped){
    listScroll.innerHTML = '';

    if (records.length === 0){
      const div = document.createElement('div');
      div.className = 'empty-state';
      div.textContent = 'テキストファイルが見つかりませんでした（「病棟:」「病室:」の記載がある .txt ファイルを対象にしています）。';
      listScroll.appendChild(div);
      statusLine.textContent = skipped ? `${skipped} 件のファイルを解析できませんでした。` : '';
      return;
    }

    const groups = new Map();
    for (const rec of records){
      if (!groups.has(rec.ward)) groups.set(rec.ward, []);
      groups.get(rec.ward).push(rec);
    }

    const wardNames = Array.from(groups.keys()).sort((a,b) => a.localeCompare(b, 'ja'));

    for (const ward of wardNames){
      const rooms = groups.get(ward).sort((a,b) => a.roomNum - b.roomNum);

      const section = document.createElement('div');
      section.className = 'ward-group';

      const head = document.createElement('div');
      head.className = 'ward-head';
      const hasMap = wardImages.has(ward);
      if (hasMap){
        head.classList.add('has-map');
        head.title = 'タップで病棟マップを表示';
      }
      head.innerHTML = `<span>${escapeHtml(ward)}</span>${hasMap ? '<span class="map-icon">🗺️</span>' : ''}<span class="count">${rooms.length}件</span>`;
      if (hasMap){
        head.addEventListener('click', () => openWardMap(ward));
      }
      section.appendChild(head);

      for (const rec of rooms){
        const row = document.createElement('button');
        row.className = 'room-row';
        row.innerHTML = `
          <span class="room-badge">${escapeHtml(rec.room)}</span>
          <span class="room-meta">
            <span class="demo">${escapeHtml(rec.demo || 'ー')}</span>
            <span class="diag">・ ${escapeHtml(statusText(rec) || 'ー')}</span>
          </span>
          <span class="chev">›</span>
        `;
        row.addEventListener('click', () => openDetail(rec));
        section.appendChild(row);
      }

      listScroll.appendChild(section);
    }

    statusLine.textContent = `${records.length} 件を読み込みました${skipped ? `（${skipped} 件は解析できず除外）` : ''}。`;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
  }

  // ---------- detail view / flip navigation ----------
  function openDetail(rec){
    chipRow.innerHTML = `
      <span class="chip chip-ward">${escapeHtml(rec.ward)}</span>
      <span class="chip chip-room">${escapeHtml(rec.room)}</span>
    `;
    detailPid.textContent = `${maskPid(rec.pid)}${rec.demo ? ' ・ ' + rec.demo : ''}`;
    detailBody.textContent = rec.text;
    detailBody.scrollTop = 0;
    flipCard.classList.add('flipped');
  }

  function backToList(){
    flipCard.classList.remove('flipped');
  }

  backBtn.addEventListener('click', backToList);

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const overlay = document.getElementById('mapOverlay');
    if (overlay && !overlay.hidden){
      closeWardMap();
    } else if (flipCard.classList.contains('flipped')){
      backToList();
    }
  });

  // swipe right on detail view = flip back
  (function enableSwipeBack(){
    const backFace = document.querySelector('.face-back');
    let startX = null, startY = null;
    backFace.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY;
    }, { passive:true });
    backFace.addEventListener('touchend', (e) => {
      if (startX === null) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - startX;
      const dy = Math.abs(t.clientY - startY);
      if (dx > 70 && dy < 60) backToList();
      startX = null; startY = null;
    }, { passive:true });
  })();

  // ---------- folder picking ----------
  const SUPPORTS_DIR_PICKER = 'showDirectoryPicker' in window;

  async function pickFolder(){
    if (SUPPORTS_DIR_PICKER){
      try {
        const handle = await window.showDirectoryPicker({ mode: 'read' });
        await saveHandle(handle);
        await loadFolder(handle);
      } catch (e){
        if (e.name !== 'AbortError') statusLine.textContent = 'フォルダの選択に失敗しました。';
      }
      return;
    }
    // Android等 File System Access API 非対応ブラウザ向けフォールバック。
    // OneDriveアプリが導入済みなら、選択画面から OneDrive 内のフォルダにも入れる。
    folderInput.click();
  }

  async function loadFromFileList(fileList){
    statusLine.textContent = '読み込み中…';
    listScroll.innerHTML = '';
    wardImages = new Map();

    const firstPath = fileList[0] && fileList[0].webkitRelativePath;
    folderField.textContent = firstPath ? firstPath.split('/')[0] : '選択したフォルダ';

    const records = [];
    let skipped = 0;

    for (const file of fileList){
      if (/\.png$/i.test(file.name)){
        considerWardMapFile(file.name, file);
        continue;
      }
      if (!/\.txt$/i.test(file.name)) continue;
      try {
        const text = await file.text();
        const rec = parseRecord(file.name, text);
        if (rec) records.push(rec);
        else skipped++;
      } catch (e){
        skipped++;
      }
    }

    renderList(records, skipped);
  }

  folderInput.addEventListener('change', (e) => {
    const files = e.target.files;
    if (files && files.length) loadFromFileList(files);
    folderInput.value = ''; // 同じフォルダを選び直せるようにリセット
  });

  pickBtn.addEventListener('click', pickFolder);
  refreshBtn.addEventListener('click', () => {
    if (SUPPORTS_DIR_PICKER){
      if (currentHandle) loadFolder(currentHandle);
    } else {
      // ハンドルを保持できないため、再読み込みは選び直しになる
      folderInput.click();
    }
  });

  // ---------- PWA: service worker registration ----------
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // ---------- PWA: install prompt ----------
  const installBtn = document.getElementById('installBtn');
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    installBtn.hidden = false;
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    installBtn.hidden = true;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
  });
  window.addEventListener('appinstalled', () => {
    installBtn.hidden = true;
  });

  if (location.protocol === 'file:'){
    statusLine.textContent = 'ヒント: インストール可能なアプリとして使うには start_server.bat でローカルサーバー経由で開いてください。';
  }

  // ---------- restore last folder on startup ----------
  async function restore(){
    if (!SUPPORTS_DIR_PICKER){
      // Android等: フォルダの永続アクセスができないため毎回選び直しになる。
      // その旨を一度だけ案内する。
      statusLine.textContent = '「フォルダを選択」から毎回フォルダを選んでください（このブラウザでは前回の選択を記憶できません）。';
      return;
    }
    let handle;
    try {
      handle = await loadHandle();
    } catch(e){ return; }
    if (!handle) return;

    folderField.textContent = handle.name + '（再読込中…）';
    try {
      const perm = await handle.queryPermission({ mode:'read' });
      if (perm === 'granted'){
        await loadFolder(handle);
      } else {
        folderField.textContent = handle.name;
        statusLine.textContent = '前回のフォルダへのアクセス許可が必要です。';
        currentHandle = handle;
        pickBtn.textContent = '🔓 フォルダへのアクセスを許可';
        pickBtn.addEventListener('click', async function reauth(){
          const p = await handle.requestPermission({ mode:'read' });
          if (p === 'granted'){
            pickBtn.textContent = '📁 フォルダを選択';
            pickBtn.removeEventListener('click', reauth);
            await loadFolder(handle);
          }
        }, { once:true });
      }
    } catch(e){
      folderField.textContent = '未選択';
    }
  }

  restore();
})();
</script>
</body>
</html>
